name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names. github.repository_owner preserves the
  # case of the GitHub handle, so we lowercase it in a step below and reference
  # ${{ steps.owner.outputs.lc }} when tagging images.

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv pip install --system ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  build-and-push:
    name: Build & push images
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.owner.outputs.lc }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo owner (GHCR requires lowercase)
        id: owner
        run: echo "lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/biteplate-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/biteplate-backend:latest

      - name: Build & push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/biteplate-worker:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/biteplate-worker:latest

  deploy:
    name: Deploy to K8s
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply namespace first
        run: kubectl apply -f k8s/00-namespace.yaml

      - name: Apply remaining manifests
        run: kubectl apply -f k8s/

      - name: Roll out new images (must run BEFORE migrations so pods are healthy)
        id: rollout
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          OWNER: ${{ needs.build-and-push.outputs.owner }}
        run: |
          kubectl -n biteplate set image deploy/biteplate-api \
            api=${{ env.REGISTRY }}/${OWNER}/biteplate-backend:${TAG}
          kubectl -n biteplate set image deploy/biteplate-worker \
            worker=${{ env.REGISTRY }}/${OWNER}/biteplate-worker:${TAG}
          kubectl -n biteplate set image deploy/biteplate-beat \
            beat=${{ env.REGISTRY }}/${OWNER}/biteplate-worker:${TAG}
          kubectl -n biteplate rollout status deploy/biteplate-api    --timeout=600s
          kubectl -n biteplate rollout status deploy/biteplate-worker --timeout=600s
          kubectl -n biteplate rollout status deploy/biteplate-beat   --timeout=600s

      - name: Debug on rollout failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "=== Pods ==="
          kubectl -n biteplate get pods -o wide
          echo
          echo "=== Events (last 30) ==="
          kubectl -n biteplate get events --sort-by=.lastTimestamp | tail -30
          echo
          echo "=== Describe failing pods ==="
          for pod in $(kubectl -n biteplate get pods -o name | grep -E 'biteplate-(api|worker|beat)'); do
            echo "--- $pod ---"
            kubectl -n biteplate describe $pod | tail -25
          done

      - name: Run alembic migrations (now api pod is up)
        run: kubectl -n biteplate exec deploy/biteplate-api -- alembic upgrade head
