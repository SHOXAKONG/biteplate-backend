name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/biteplate-backend
  IMAGE_WORKER: ${{ github.repository_owner }}/biteplate-worker

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv pip install --system ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  build-and-push:
    name: Build & push images
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest

      - name: Build & push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:latest

  deploy:
    name: Deploy to K8s
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Run alembic migrations
        run: |
          kubectl -n biteplate wait --for=condition=available --timeout=120s deployment/biteplate-api || true
          kubectl -n biteplate exec deploy/biteplate-api -- alembic upgrade head

      - name: Roll out new images
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          kubectl -n biteplate set image deploy/biteplate-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${TAG}
          kubectl -n biteplate set image deploy/biteplate-worker \
            worker=${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:${TAG}
          kubectl -n biteplate set image deploy/biteplate-beat \
            beat=${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:${TAG}
          kubectl -n biteplate rollout status deploy/biteplate-api    --timeout=180s
          kubectl -n biteplate rollout status deploy/biteplate-worker --timeout=180s
          kubectl -n biteplate rollout status deploy/biteplate-beat   --timeout=180s
