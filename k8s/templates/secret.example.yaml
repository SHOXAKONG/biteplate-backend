apiVersion: v1
kind: Secret
metadata:
  name: biteplate-secrets
  namespace: biteplate
type: Opaque
stringData:
  # Point at your external DB server (managed Postgres, separate VM, etc.).
  DATABASE_URL: "postgresql+asyncpg://biteplate:CHANGE_ME@db.example.internal:5432/biteplate"
  SYNC_DATABASE_URL: "postgresql://biteplate:CHANGE_ME@db.example.internal:5432/biteplate"
  ESKIZ_EMAIL: ""
  ESKIZ_PASSWORD: ""
  ESKIZ_FROM: "4546"
