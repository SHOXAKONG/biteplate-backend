apiVersion: apps/v1
kind: Deployment
metadata:
  name: biteplate-worker
  namespace: biteplate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biteplate-worker
  template:
    metadata:
      labels:
        app: biteplate-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/REPLACE_OWNER/biteplate-worker:latest
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: biteplate-config
            - secretRef:
                name: biteplate-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biteplate-beat
  namespace: biteplate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biteplate-beat
  template:
    metadata:
      labels:
        app: biteplate-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/REPLACE_OWNER/biteplate-worker:latest
          imagePullPolicy: Always
          args: ["beat"]
          envFrom:
            - configMapRef:
                name: biteplate-config
            - secretRef:
                name: biteplate-secrets
