[project]
name = "biteplate-backend"
version = "0.1.0"
description = "BitePlate Smart Restaurant Management System - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "k8s*", "build*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "build",
    "dist",
    ".venv",
    "alembic",  # migration templates — not worth churning
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # function call in defaults — intentional for FastAPI Depends/Query
    "UP037", # quoted forward references — needed for SQLAlchemy self-refs
    "UP046", # PEP 695 generic syntax — keep classic Generic[T] for clarity
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy models use string forward refs that pyflakes can't resolve at lint time.
"app/models/order.py" = ["F821"]
"app/models/order_item.py" = ["F821"]
"alembic/env.py" = ["I001"]
"tests/*" = ["B009", "B010"]  # getattr/setattr in tests is fine for clarity

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
